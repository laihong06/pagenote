<!doctype html>
<html lang="zh-CN" data-platform="tablet" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>pagenote · 界面样板</title>
    <link rel="stylesheet" href="assets/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="reference.css" />
    <script defer src="assets/vendor/lucide.min.js"></script>
    <script defer src="assets/vendor/marked.umd.js"></script>
    <script defer src="assets/vendor/purify.min.js"></script>
    <script defer src="assets/vendor/katex/katex.min.js"></script>
    <script defer src="assets/vendor/katex/auto-render.min.js"></script>
    <script defer src="reference.js"></script>
  </head>
  <body>
    <header class="reference-bar" aria-label="设计样板工具栏">
      <a class="reference-brand" href="#shelf"
        ><i data-lucide="panels-top-left"></i><strong>pagenote</strong
        ><span>界面样板</span></a
      >
      <label class="scene-picker"
        ><span class="sr-only">页面</span
        ><select id="scene">
          <option value="shelf">书架</option>
          <option value="reader">双栏阅读器</option>
          <option value="new">新建项目</option>
          <option value="rain">雨课堂</option>
          <option value="settings">设置</option>
          <option value="spec">基础规范</option>
        </select></label
      >
      <div class="reference-spacer"></div>
      <span class="demo-label">示例数据</span>
      <div class="segments" aria-label="平台">
        <button type="button" data-platform-choice="tablet" aria-pressed="true">
          <i data-lucide="tablet"></i><span>平板</span>
        </button>
        <button
          type="button"
          data-platform-choice="desktop"
          aria-pressed="false"
        >
          <i data-lucide="monitor"></i><span>桌面</span>
        </button>
      </div>
      <button
        type="button"
        class="icon-button"
        id="theme-toggle"
        aria-label="切换明暗主题"
        title="切换明暗主题"
      >
        <i data-lucide="moon"></i>
      </button>
      <button
        type="button"
        class="icon-button"
        id="reference-toggle"
        aria-label="参考截图"
        title="参考截图"
        aria-expanded="false"
      >
        <i data-lucide="images"></i>
      </button>
      <button
        type="button"
        class="icon-button"
        id="clean-toggle"
        aria-label="只显示应用界面"
        title="只显示应用界面"
      >
        <i data-lucide="scan"></i>
      </button>
    </header>
    <div class="reference-workspace">
      <main id="app" aria-label="pagenote 界面"></main>
      <aside id="reference-panel" hidden aria-label="参考截图">
        <header>
          <h2>参考截图</h2>
          <button
            type="button"
            class="icon-button"
            data-action="close-reference"
            aria-label="关闭参考截图"
            title="关闭"
          >
            <i data-lucide="x"></i>
          </button>
        </header>
        <label class="file-drop"
          ><i data-lucide="image-plus"></i><span>选择参考图片</span
          ><input
            id="reference-file"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        /></label>
        <div id="reference-empty">还没有参考图片</div>
        <img id="reference-image" alt="用户选择的参考截图" hidden />
        <div id="reference-options" hidden>
          <label
            >对照方式<select id="reference-mode">
              <option value="side">并排</option>
              <option value="overlay">叠加</option>
            </select></label
          ><label
            >透明度<input
              id="reference-opacity"
              type="range"
              min="10"
              max="90"
              value="45" /></label
          ><button type="button" data-action="clear-reference">移除图片</button>
        </div>
      </aside>
      <img id="reference-overlay" alt="" hidden aria-hidden="true" />
    </div>
    <button
      type="button"
      class="icon-button restore-tools"
      id="restore-tools"
      hidden
      aria-label="显示设计工具栏"
      title="显示设计工具栏"
    >
      <i data-lucide="panels-top-left"></i>
    </button>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
