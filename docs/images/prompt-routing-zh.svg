<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc"><title id="title">Pagenote 提示词与数据路由</title><desc id="desc">入口选择生成或修改，本地准备材料，通用教学与用户偏好支持上层 Agent 自主执行，保存后更新候选偏好。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#8799ae"/></marker></defs><style>text{font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;fill:#24364b}.heading{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#65788d}.label{font-size:18px;font-weight:650}.body{font-size:14px;fill:#52687e}.tiny{font-size:12px;fill:#6c7f94}.edge{fill:none;stroke:#8799ae;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style><rect width="1320" height="760" rx="20" fill="#f6f8fc"/><text x="44" y="55" class="heading">从学习需求，到逐页理解</text><text x="44" y="86" class="sub">软件准备数据与教学约定 · 上层 Agent 自主规划、并发与管理上下文</text><rect x="44" y="172" width="240" height="154" rx="14" fill="white" stroke="#dce4ef"/><rect x="44" y="188" width="4" height="26" rx="2" fill="#557fbc"/><text x="64" y="207" class="label" style="font-size:18px">01 统一入口</text><text x="64" y="237" class="body" style="font-size:14px">识别任务、页码与修改范围</text><text x="64" y="261" class="body" style="font-size:14px">模块版本 · MCP 能力与数据位置</text><text x="64" y="285" class="body" style="font-size:14px">page-notes://prompts/index</text><rect x="342" y="125" width="240" height="122" rx="14" fill="white" stroke="#dce4ef"/><rect x="342" y="141" width="4" height="26" rx="2" fill="#557fbc"/><text x="362" y="160" class="label" style="font-size:18px">初次生成 / 补讲</text><text x="362" y="190" class="body" style="font-size:14px">generation → 通用教学</text><text x="362" y="214" class="body" style="font-size:14px">逐页充分解释、自然承接</text><rect x="342" y="285" width="240" height="122" rx="14" fill="white" stroke="#dce4ef"/><rect x="342" y="301" width="4" height="26" rx="2" fill="#c18b46"/><text x="362" y="320" class="label" style="font-size:18px">按意见修改</text><text x="362" y="350" class="body" style="font-size:14px">tag-edit → 保留未涉及内容</text><text x="362" y="374" class="body" style="font-size:14px">Tag 或直接文字修改要求</text><rect x="640" y="172" width="272" height="204" rx="14" fill="white" stroke="#dce4ef"/><rect x="640" y="188" width="4" height="26" rx="2" fill="#368d88"/><text x="660" y="207" class="label" style="font-size:18px">02 本地材料准备</text><text x="660" y="237" class="body" style="font-size:14px">原文提取 · OCR · 图像缓存</text><text x="660" y="261" class="body" style="font-size:14px">生成：当前页 + 相邻源页</text><text x="660" y="285" class="body" style="font-size:14px">修改：原文 + 笔记 + 意见</text><text x="660" y="309" class="body" style="font-size:14px">版本标识、警告与按需续读</text><text x="660" y="333" class="body" style="font-size:14px">page_notes_prepare_task</text><rect x="970" y="172" width="306" height="204" rx="14" fill="white" stroke="#dce4ef"/><rect x="970" y="188" width="4" height="26" rx="2" fill="#8b74b0"/><text x="990" y="207" class="label" style="font-size:18px">03 上层 Agent 执行</text><text x="990" y="237" class="body" style="font-size:14px">自主安排会话、子代理与上下文</text><text x="990" y="261" class="body" style="font-size:14px">按需使用准备材料与教学技能</text><text x="990" y="285" class="body" style="font-size:14px">生图 · 代码 · 公式 · 流程图</text><text x="990" y="309" class="body" style="font-size:14px">逐页是成果约定，不限制调用次数</text><path d="M284 226 H312 V186 H342" class="edge"/><path d="M312 226 V346 H342" class="edge"/><path d="M582 186 H610 V232 H640" class="edge"/><path d="M582 346 H610 V302 H640" class="edge"/><path d="M912 270 H970" class="edge"/><rect x="342" y="460" width="570" height="164" rx="14" fill="#edf2f9"/><text x="362" y="490" class="label">共享教学层 · 软件内可编辑、可恢复默认</text><rect x="358" y="507" width="170" height="98" rx="14" fill="white" stroke="#dce4ef"/><rect x="358" y="523" width="4" height="26" rx="2" fill="#557fbc"/><text x="378" y="542" class="label" style="font-size:14px">教学技能</text><text x="378" y="572" class="body" style="font-size:12px">learning / page-tutor</text><text x="378" y="596" class="body" style="font-size:12px">递进解释与多模态表达</text><rect x="542" y="507" width="164" height="98" rx="14" fill="white" stroke="#dce4ef"/><rect x="542" y="523" width="4" height="26" rx="2" fill="#368d88"/><text x="562" y="542" class="label" style="font-size:14px">输出约定</text><text x="562" y="572" class="body" style="font-size:12px">output</text><text x="562" y="596" class="body" style="font-size:12px">Markdown 与附件</text><rect x="720" y="507" width="176" height="98" rx="14" fill="white" stroke="#dce4ef"/><rect x="720" y="523" width="4" height="26" rx="2" fill="#c18b46"/><text x="740" y="542" class="label" style="font-size:14px">用户画像</text><text x="740" y="572" class="body" style="font-size:12px">learner / profile</text><text x="740" y="596" class="body" style="font-size:12px">偏好、范围与反馈依据</text><rect x="970" y="460" width="306" height="164" rx="14" fill="white" stroke="#dce4ef"/><rect x="970" y="476" width="4" height="26" rx="2" fill="#368d88"/><text x="990" y="495" class="label" style="font-size:18px">04 检查并静默保存</text><text x="990" y="525" class="body" style="font-size:14px">格式预检 + revision 冲突检查</text><text x="990" y="549" class="body" style="font-size:14px">保存对应页，不打断阅读位置</text><text x="990" y="573" class="body" style="font-size:14px">成功后完成 Tag、提炼候选偏好</text><path d="M912 492 H940 V395 H1123 V376" class="edge"/><path d="M1123 376 V460" class="edge"/><path d="M970 590 H942 V660 H808 V605" class="edge"/><text x="850" y="685" text-anchor="middle" class="tiny">修改成功后回流：带来源的候选偏好，可查看、修改或清空</text><path d="M44 713 H1276" stroke="#dce4ef"/><text x="44" y="740" class="tiny">本次用户要求优先于历史偏好；模型、生图与子代理能力来自外部 Agent。</text></svg>
