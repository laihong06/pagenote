<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1730" viewBox="0 0 1240 1730" role="img" aria-labelledby="title desc"><title id="title">Pagenote 提示词路由与教学工作流</title><desc id="desc">生成与修改两条路径，经本地数据准备交给上层 Agent；教学技能、输出约定和用户画像提供共享指导，设置可以编辑各提示词。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#8297ac"/></marker></defs><style>text{font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;fill:#175b92}.title{font-size:29px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:15px;fill:#486a86}.small{font-size:13px;fill:#6e8193}.edge{fill:none;stroke:#8297ac;stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.config{stroke:#aab8c5;stroke-dasharray:5 5;stroke-width:1.4}</style><rect width="1240" height="1730" fill="white"/><text x="50" y="48" class="title">提示词路由与逐页教学</text><text x="50" y="78" class="body">原厂 Agent 自主调度会话、并发和上下文；软件提供技能与准备好的材料</text><rect x="30" y="120" width="790" height="1510" rx="20" fill="#f7fafc"/><text x="50" y="152" class="small">任务主流程</text><text x="870" y="152" class="small">可编辑的共享指导</text><path d="M425 255V295" class="edge"/><path d="M425 385V425H225V455" class="edge"/><path d="M425 425H625V455" class="edge"/><path d="M225 530V570" class="edge"/><path d="M625 530V570" class="edge"/><path d="M225 690V725H425V755" class="edge"/><path d="M625 690V725H425" class="edge"/><path d="M425 840V865H225V895" class="edge"/><path d="M425 865H625V895" class="edge"/><path d="M225 1005V1030H425V1065" class="edge"/><path d="M625 1005V1030H425" class="edge"/><path d="M425 1180V1220" class="edge"/><path d="M425 1305V1345" class="edge"/><path d="M425 1430V1470" class="edge"/><path d="M600 1515H870" class="edge"/><path d="M870 1550H835V1150H600" class="edge"/><path d="M870 520H850V1100H600" class="edge"/><path d="M870 800H865V1125H600" class="edge"/><path d="M1190 230H1210V1545" class="edge config"/><path d="M1210 340H1190" class="edge config"/><path d="M1210 520H1190" class="edge config"/><path d="M1210 800H1190" class="edge config"/><path d="M1210 1545H1190" class="edge config"/><rect x="250" y="180" width="350" height="75" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="223.5" text-anchor="middle" class="label">用户提出需求</text><rect x="250" y="295" width="350" height="90" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="323" text-anchor="middle" class="label">统一入口与路由索引</text><text x="425" y="352" text-anchor="middle" class="body">识别任务、范围与目标文档</text><text x="425" y="375" text-anchor="middle" class="body">模块版本 · MCP 工具与数据位置</text><rect x="50" y="455" width="350" height="75" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="225" y="498.5" text-anchor="middle" class="label">初次生成 / 补讲指定页</text><rect x="450" y="455" width="350" height="75" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="625" y="498.5" text-anchor="middle" class="label">按修改意见调整已有内容</text><rect x="50" y="570" width="350" height="120" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="225" y="613" text-anchor="middle" class="label">生成策略</text><text x="225" y="642" text-anchor="middle" class="body">逐页成果 · 并发由 Agent 决定</text><text x="225" y="665" text-anchor="middle" class="body">相邻源页衔接 · 逐页静默保存</text><rect x="450" y="570" width="350" height="120" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="625" y="613" text-anchor="middle" class="label">修改策略</text><text x="625" y="642" text-anchor="middle" class="body">读取 Tag 或直接要求与当前内容</text><text x="625" y="665" text-anchor="middle" class="body">定位修改范围，保留未涉及内容</text><rect x="250" y="755" width="350" height="85" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="792" text-anchor="middle" class="label">本地数据准备层</text><text x="425" y="821" text-anchor="middle" class="body">page_notes_prepare_task</text><rect x="50" y="895" width="350" height="110" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="225" y="933" text-anchor="middle" class="label">生成材料包</text><text x="225" y="962" text-anchor="middle" class="body">当前源页 + 上一源页 + 下一源页</text><text x="225" y="985" text-anchor="middle" class="body">缓存文字、OCR 与页面图像</text><rect x="450" y="895" width="350" height="110" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="625" y="933" text-anchor="middle" class="label">修改材料包</text><text x="625" y="962" text-anchor="middle" class="body">当前原文 + 原笔记 + 修改意见</text><text x="625" y="985" text-anchor="middle" class="body">定位信息、版本与附件</text><rect x="250" y="1065" width="350" height="115" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="1105.5" text-anchor="middle" class="label">上层 AI / Agent 执行</text><text x="425" y="1134.5" text-anchor="middle" class="body">自主规划、分工与管理上下文</text><text x="425" y="1157.5" text-anchor="middle" class="body">按需读取材料与调用教学能力</text><rect x="250" y="1220" width="350" height="85" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="1257" text-anchor="middle" class="label">本地提交检查</text><text x="425" y="1286" text-anchor="middle" class="body">语法、附件引用、内容版本冲突</text><rect x="250" y="1345" width="350" height="85" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="1382" text-anchor="middle" class="label">保存对应页</text><text x="425" y="1411" text-anchor="middle" class="body">保持用户当前阅读位置</text><rect x="250" y="1470" width="350" height="90" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="1509.5" text-anchor="middle" class="label">修改成功后</text><text x="425" y="1538.5" text-anchor="middle" class="body">完成对应 Tag，提炼候选偏好</text><rect x="870" y="180" width="320" height="100" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="1030" y="224.5" text-anchor="middle" class="label">软件内 AI 设置</text><text x="1030" y="253.5" text-anchor="middle" class="body">查看、编辑、保存、恢复默认</text><rect x="870" y="295" width="320" height="90" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="1030" y="334.5" text-anchor="middle" class="label">入口与场景提示词</text><text x="1030" y="363.5" text-anchor="middle" class="body">统一入口 · 生成策略 · 修改策略</text><rect x="870" y="455" width="320" height="130" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="1030" y="491.5" text-anchor="middle" class="label">通用教学技能</text><text x="1030" y="520.5" text-anchor="middle" class="body">递进解释、示例、图像化理解</text><text x="1030" y="543.5" text-anchor="middle" class="body">生图、代码块、公式、流程图</text><text x="1030" y="566.5" text-anchor="middle" class="body">依知识点需要选用表达方式</text><rect x="870" y="755" width="320" height="100" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="1030" y="788" text-anchor="middle" class="label">输出约定</text><text x="1030" y="817" text-anchor="middle" class="body">Markdown、附件引用</text><text x="1030" y="840" text-anchor="middle" class="body">公式与图表格式</text><rect x="870" y="1470" width="320" height="130" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="1030" y="1518" text-anchor="middle" class="label">全局用户画像</text><text x="1030" y="1547" text-anchor="middle" class="body">学习基础、表达偏好、教学风格</text><text x="1030" y="1570" text-anchor="middle" class="body">候选偏好保留来源，可修改或清空</text><text x="1030" y="950" text-anchor="middle" class="small">实线：材料与执行流程</text><text x="1030" y="975" text-anchor="middle" class="small">虚线：设置中可编辑的提示词</text><path d="M50 1655H1190" stroke="#dce5ed"/><text x="50" y="1688" class="small">入口只负责找路；本次明确要求优先于历史偏好。逐页是成果单位，不是会话或工具调用次数限制。</text></svg>