<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc"><title id="title">Pagenote prompt and data routing</title><desc id="desc">An editable entry routes generation and revisions to local prepared data. Shared teaching rules and preferences support host-Agent execution and revision-protected saves.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#8799ae"/></marker></defs><style>text{font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;fill:#24364b}.heading{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#65788d}.label{font-size:18px;font-weight:650}.body{font-size:14px;fill:#52687e}.tiny{font-size:12px;fill:#6c7f94}.edge{fill:none;stroke:#8799ae;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style><rect width="1320" height="760" rx="20" fill="#f6f8fc"/><text x="44" y="55" class="heading">From a learning task to page-linked understanding</text><text x="44" y="86" class="sub">Local data and teaching guidance · Host Agent owns planning, delegation and context</text><rect x="44" y="172" width="240" height="154" rx="14" fill="white" stroke="#dce4ef"/><rect x="44" y="188" width="4" height="26" rx="2" fill="#557fbc"/><text x="64" y="207" class="label" style="font-size:18px">01 Editable entry</text><text x="64" y="237" class="body" style="font-size:14px">Task, page and target scope</text><text x="64" y="261" class="body" style="font-size:14px">Revisions, tools and data map</text><text x="64" y="285" class="body" style="font-size:14px">page-notes://prompts/index</text><rect x="342" y="125" width="240" height="122" rx="14" fill="white" stroke="#dce4ef"/><rect x="342" y="141" width="4" height="26" rx="2" fill="#557fbc"/><text x="362" y="160" class="label" style="font-size:18px">Generate / extend</text><text x="362" y="190" class="body" style="font-size:14px">generation → shared teaching</text><text x="362" y="214" class="body" style="font-size:14px">Thorough, coherent page notes</text><rect x="342" y="285" width="240" height="122" rx="14" fill="white" stroke="#dce4ef"/><rect x="342" y="301" width="4" height="26" rx="2" fill="#c18b46"/><text x="362" y="320" class="label" style="font-size:18px">Revise from feedback</text><text x="362" y="350" class="body" style="font-size:14px">tag-edit → preserve other text</text><text x="362" y="374" class="body" style="font-size:14px">Tags or direct instructions</text><rect x="640" y="172" width="272" height="204" rx="14" fill="white" stroke="#dce4ef"/><rect x="640" y="188" width="4" height="26" rx="2" fill="#368d88"/><text x="660" y="207" class="label" style="font-size:18px">02 Local preparation</text><text x="660" y="237" class="body" style="font-size:14px">Source text, OCR, visual cache</text><text x="660" y="261" class="body" style="font-size:14px">Generate: current + neighbors</text><text x="660" y="285" class="body" style="font-size:14px">Revise: source + notes + feedback</text><text x="660" y="309" class="body" style="font-size:14px">Revisions, warnings, continuations</text><text x="660" y="333" class="body" style="font-size:14px">page_notes_prepare_task</text><rect x="970" y="172" width="306" height="204" rx="14" fill="white" stroke="#dce4ef"/><rect x="970" y="188" width="4" height="26" rx="2" fill="#8b74b0"/><text x="990" y="207" class="label" style="font-size:18px">03 Host Agent executes</text><text x="990" y="237" class="body" style="font-size:14px">Owns sessions, agents and context</text><text x="990" y="261" class="body" style="font-size:14px">Uses prepared data and skills</text><text x="990" y="285" class="body" style="font-size:14px">Images, code, math and diagrams</text><text x="990" y="309" class="body" style="font-size:14px">Page-linked output, flexible calls</text><path d="M284 226 H312 V186 H342" class="edge"/><path d="M312 226 V346 H342" class="edge"/><path d="M582 186 H610 V232 H640" class="edge"/><path d="M582 346 H610 V302 H640" class="edge"/><path d="M912 270 H970" class="edge"/><rect x="342" y="460" width="570" height="164" rx="14" fill="#edf2f9"/><text x="362" y="490" class="label">Shared guidance · editable and resettable in the app</text><rect x="358" y="507" width="170" height="98" rx="14" fill="white" stroke="#dce4ef"/><rect x="358" y="523" width="4" height="26" rx="2" fill="#557fbc"/><text x="378" y="542" class="label" style="font-size:14px">Teaching skills</text><text x="378" y="572" class="body" style="font-size:12px">learning / page-tutor</text><text x="378" y="596" class="body" style="font-size:12px">Explain + illustrate</text><rect x="542" y="507" width="164" height="98" rx="14" fill="white" stroke="#dce4ef"/><rect x="542" y="523" width="4" height="26" rx="2" fill="#368d88"/><text x="562" y="542" class="label" style="font-size:14px">Output rules</text><text x="562" y="572" class="body" style="font-size:12px">output</text><text x="562" y="596" class="body" style="font-size:12px">Markdown + assets</text><rect x="720" y="507" width="176" height="98" rx="14" fill="white" stroke="#dce4ef"/><rect x="720" y="523" width="4" height="26" rx="2" fill="#c18b46"/><text x="740" y="542" class="label" style="font-size:14px">Learner preferences</text><text x="740" y="572" class="body" style="font-size:12px">learner / profile</text><text x="740" y="596" class="body" style="font-size:12px">Style + feedback</text><rect x="970" y="460" width="306" height="164" rx="14" fill="white" stroke="#dce4ef"/><rect x="970" y="476" width="4" height="26" rx="2" fill="#368d88"/><text x="990" y="495" class="label" style="font-size:18px">04 Validate and save</text><text x="990" y="525" class="body" style="font-size:14px">Syntax + revision conflict checks</text><text x="990" y="549" class="body" style="font-size:14px">Save without moving the reader</text><text x="990" y="573" class="body" style="font-size:14px">Resolve Tags; derive preferences</text><path d="M912 492 H940 V395 H1123 V376" class="edge"/><path d="M1123 376 V460" class="edge"/><path d="M970 590 H942 V660 H808 V605" class="edge"/><text x="850" y="685" text-anchor="middle" class="tiny">After saved edits: evidence-linked preferences, editable or removable</text><path d="M44 713 H1276" stroke="#dce4ef"/><text x="44" y="740" class="tiny">Current instructions override stored preferences. Models, image generation and agents are provided by the host.</text></svg>
