<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1730" viewBox="0 0 1240 1730" role="img" aria-labelledby="title desc"><title id="title">Pagenote prompt routing and teaching workflow</title><desc id="desc">Generation and revision paths join local preparation and host-Agent execution, supported by editable teaching, output and learner modules.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#8297ac"/></marker></defs><style>text{font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;fill:#175b92}.title{font-size:29px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:15px;fill:#486a86}.small{font-size:13px;fill:#6e8193}.edge{fill:none;stroke:#8297ac;stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.config{stroke:#aab8c5;stroke-dasharray:5 5;stroke-width:1.4}</style><rect width="1240" height="1730" fill="white"/><text x="50" y="48" class="title">Prompt routing and page-linked teaching</text><text x="50" y="78" class="body">The host Agent owns sessions, concurrency and context; the app supplies skills and prepared data</text><rect x="30" y="120" width="790" height="1510" rx="20" fill="#f7fafc"/><text x="50" y="152" class="small">TASK FLOW</text><text x="870" y="152" class="small">EDITABLE SHARED GUIDANCE</text><path d="M425 255V295" class="edge"/><path d="M425 385V425H225V455" class="edge"/><path d="M425 425H625V455" class="edge"/><path d="M225 530V570" class="edge"/><path d="M625 530V570" class="edge"/><path d="M225 690V725H425V755" class="edge"/><path d="M625 690V725H425" class="edge"/><path d="M425 840V865H225V895" class="edge"/><path d="M425 865H625V895" class="edge"/><path d="M225 1005V1030H425V1065" class="edge"/><path d="M625 1005V1030H425" class="edge"/><path d="M425 1180V1220" class="edge"/><path d="M425 1305V1345" class="edge"/><path d="M425 1430V1470" class="edge"/><path d="M600 1515H870" class="edge"/><path d="M870 1550H835V1150H600" class="edge"/><path d="M870 520H850V1100H600" class="edge"/><path d="M870 800H865V1125H600" class="edge"/><path d="M1190 230H1210V1545" class="edge config"/><path d="M1210 340H1190" class="edge config"/><path d="M1210 520H1190" class="edge config"/><path d="M1210 800H1190" class="edge config"/><path d="M1210 1545H1190" class="edge config"/><rect x="250" y="180" width="350" height="75" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="223.5" text-anchor="middle" class="label">User request</text><rect x="250" y="295" width="350" height="90" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="323" text-anchor="middle" class="label">Entry and routing index</text><text x="425" y="352" text-anchor="middle" class="body">Identify task, scope and document</text><text x="425" y="375" text-anchor="middle" class="body">Module revisions · tools · data locations</text><rect x="50" y="455" width="350" height="75" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="225" y="498.5" text-anchor="middle" class="label">Generate / extend selected pages</text><rect x="450" y="455" width="350" height="75" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="625" y="498.5" text-anchor="middle" class="label">Revise existing content from feedback</text><rect x="50" y="570" width="350" height="120" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="225" y="613" text-anchor="middle" class="label">Generation strategy</text><text x="225" y="642" text-anchor="middle" class="body">Page-linked output · Agent-owned concurrency</text><text x="225" y="665" text-anchor="middle" class="body">Neighbor-page continuity · silent saves</text><rect x="450" y="570" width="350" height="120" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="625" y="613" text-anchor="middle" class="label">Revision strategy</text><text x="625" y="642" text-anchor="middle" class="body">Read Tags / direct requests and current content</text><text x="625" y="665" text-anchor="middle" class="body">Locate the scope; preserve other content</text><rect x="250" y="755" width="350" height="85" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="792" text-anchor="middle" class="label">Local data preparation</text><text x="425" y="821" text-anchor="middle" class="body">page_notes_prepare_task</text><rect x="50" y="895" width="350" height="110" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="225" y="933" text-anchor="middle" class="label">Generation material bundle</text><text x="225" y="962" text-anchor="middle" class="body">Current + previous + next source page</text><text x="225" y="985" text-anchor="middle" class="body">Cached text, OCR and page visuals</text><rect x="450" y="895" width="350" height="110" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="625" y="933" text-anchor="middle" class="label">Revision material bundle</text><text x="625" y="962" text-anchor="middle" class="body">Source + existing notes + feedback</text><text x="625" y="985" text-anchor="middle" class="body">Locations, revisions and attachments</text><rect x="250" y="1065" width="350" height="115" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="1105.5" text-anchor="middle" class="label">Host AI / Agent executes</text><text x="425" y="1134.5" text-anchor="middle" class="body">Plans, delegates and manages context</text><text x="425" y="1157.5" text-anchor="middle" class="body">Reads and uses teaching tools as needed</text><rect x="250" y="1220" width="350" height="85" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="1257" text-anchor="middle" class="label">Local submission checks</text><text x="425" y="1286" text-anchor="middle" class="body">Syntax, asset references, revision conflicts</text><rect x="250" y="1345" width="350" height="85" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="1382" text-anchor="middle" class="label">Save to the matching page</text><text x="425" y="1411" text-anchor="middle" class="body">Preserve the current reading position</text><rect x="250" y="1470" width="350" height="90" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="425" y="1509.5" text-anchor="middle" class="label">After successful revisions</text><text x="425" y="1538.5" text-anchor="middle" class="body">Resolve Tags; derive candidate preferences</text><rect x="870" y="180" width="320" height="100" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="1030" y="224.5" text-anchor="middle" class="label">In-app AI settings</text><text x="1030" y="253.5" text-anchor="middle" class="body">View, edit, save and restore defaults</text><rect x="870" y="295" width="320" height="90" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="1030" y="334.5" text-anchor="middle" class="label">Entry and scenario prompts</text><text x="1030" y="363.5" text-anchor="middle" class="body">Entry · generation · revision</text><rect x="870" y="455" width="320" height="130" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="1030" y="491.5" text-anchor="middle" class="label">Shared teaching skills</text><text x="1030" y="520.5" text-anchor="middle" class="body">Progressive explanation and examples</text><text x="1030" y="543.5" text-anchor="middle" class="body">Images, code, formulas and diagrams</text><text x="1030" y="566.5" text-anchor="middle" class="body">Choose formats that fit the subject</text><rect x="870" y="755" width="320" height="100" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="1030" y="788" text-anchor="middle" class="label">Output rules</text><text x="1030" y="817" text-anchor="middle" class="body">Markdown and asset references</text><text x="1030" y="840" text-anchor="middle" class="body">Math and diagram syntax</text><rect x="870" y="1470" width="320" height="130" rx="15" fill="#e6f3ff" stroke="#cfdde9" stroke-width="1.3"/><text x="1030" y="1518" text-anchor="middle" class="label">Global learner preferences</text><text x="1030" y="1547" text-anchor="middle" class="body">Background, preferences, teaching style</text><text x="1030" y="1570" text-anchor="middle" class="body">Evidence-linked; editable or removable</text><text x="1030" y="950" text-anchor="middle" class="small">Solid: data and execution</text><text x="1030" y="975" text-anchor="middle" class="small">Dashed: prompts editable in settings</text><path d="M50 1655H1190" stroke="#dce5ed"/><text x="50" y="1688" class="small">The entry routes tasks. Current instructions override stored preferences. Pages are output units, not session or tool-call limits.</text></svg>