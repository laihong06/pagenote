name: Platform integration validation
on:
  pull_request:
    branches: [beta, 'windows/beta', 'macos/beta', 'android/beta']
  push:
    branches: [beta, 'windows/beta', 'macos/beta', 'android/beta']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PAGENOTE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-electron.mjs
      - run: npm run test:platforms
      - run: node scripts/platform.mjs ${{ matrix.platform }} build
      - name: Prepare isolated test workspace
        run: node -e "require('node:fs').mkdirSync('tmp', { recursive: true })"
      - run: npm test
      - run: node tests/bookshelf-store.mjs && node tests/bookshelf-covers.mjs && node tests/bookshelf-projects.mjs && node tests/yuketang-save-race.mjs
      - run: npm run test:yuketang
      - run: node scripts/capture-platform-guide.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-guide-${{ matrix.platform }}
          path: docs/${{ matrix.platform }}/guide/images/current/
          if-no-files-found: warn
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests and application/test compilation
        working-directory: android
        run: sh gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-integration-validation
          path: |
            android/**/build/reports/tests/
            android/app/build/outputs/apk/debug/
          if-no-files-found: warn
