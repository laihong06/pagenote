name: Upload validated Mac beta packages
on:
  push:
    branches: [beta]
    paths: ['.github/beta-upload-request.json']
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Beta Mac validation run ID
        required: true
      tag:
        description: Existing beta tag with a draft prerelease
        required: true
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve upload request
        id: request
        env:
          INPUT_RUN: ${{ inputs.run_id }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('.github/beta-upload-request.json','utf8')); const id=process.env.INPUT_RUN||r.run_id; const tag=process.env.INPUT_TAG||r.tag; if(!/^\d+$/.test(id)||!/^v\d+\.\d+\.\d+-beta\.\d+$/.test(tag)) throw Error('Invalid upload request'); fs.appendFileSync(process.env.GITHUB_OUTPUT,'run_id='+id+'\ntag='+tag+'\n');"
      - uses: actions/download-artifact@v4
        with:
          name: pagenote-beta-mac-arm64
          path: mac-artifacts
          run-id: ${{ steps.request.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/upload-beta-mac.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          VALIDATION_RUN: ${{ steps.request.outputs.run_id }}
