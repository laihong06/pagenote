<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #math { padding: 4px; overflow-x: auto; text-align: center; font-size: 16px; }
  .err { color: #c7254e; font-family: monospace; font-size: 13px; text-align: left; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="math"></div>
<script>
function renderMath(latex) {
  var el = document.getElementById('math');
  try {
    katex.render(latex, el, { displayMode: true, throwOnError: true, output: 'html' });
  } catch (e) {
    el.innerHTML = '';
    var pre = document.createElement('pre');
    pre.className = 'err';
    pre.textContent = latex + '\n' + (e && e.message ? e.message : String(e));
    el.appendChild(pre);
  }
  return document.body.scrollHeight;
}
</script>
</body>
</html>
